de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.0

spring:
  activemq:
    broker-url: vm://localhost?broker.persistent=false
    user: ""
    password: ""
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:0

eureka:
  client:
    enabled: false

app:
  cors:
    allowed-origins:
      - http://localhost:8081
    allowed-methods:
      - GET
      - POST
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: false
    max-age: 3600
  messaging:
    training-events-queue: training.events
    dead-letter-queue: training.events.dlq
