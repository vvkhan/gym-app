server:
  port: 8081

spring:
  application:
    name: trainer-report-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/trainer_report}
      database: trainer_report
      auto-index-creation: true
  activemq:
    broker-url: tcp://localhost:61616
    user: activemq
    password: activemq
  security:
    oauth2:
      resourceserver:
        jwt:
          # Spring Security reads /.well-known/openid-configuration from this URI at startup,
          # discovers the jwks_uri, fetches the RSA public key, and validates all incoming JWTs locally.
          # Must match app.auth.issuer-uri in auth-service application.yaml.
          jwk-set-uri: http://localhost:9000/oauth2/jwks

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true

app:
  messaging:
    training-events-queue: training.events
    dead-letter-queue: training.events.dlq
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:8081}"
    allowed-methods: "${CORS_ALLOWED_METHODS:GET,POST,OPTIONS}"
    allowed-headers: "${CORS_ALLOWED_HEADERS:*}"
    allow-credentials: true
    max-age: 3600
