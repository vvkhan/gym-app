services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymdb
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d gymdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: trainer_report
    volumes:
      - mongo_data:/data/db
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  gym-core:
    build:
      context: .
      dockerfile: gym-core/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: standalone
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gymdb
      SPRING_DATASOURCE_USERNAME: docker
      SPRING_DATASOURCE_PASSWORD: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ACTIVEMQ_USER: activemq
      SPRING_ACTIVEMQ_PASSWORD: activemq
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ZGV2LXNlY3JldC1rZXktYXQtbGVhc3QtMzItY2hhcnM=}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  trainer-report-service:
    build:
      context: .
      dockerfile: trainer-report-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: standalone
      MONGODB_URI: mongodb://mongodb:27017/trainer_report
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ACTIVEMQ_USER: activemq
      SPRING_ACTIVEMQ_PASSWORD: activemq
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
  mongo_data:

networks:
  gym-network:
    driver: bridge
    name: gym-network
