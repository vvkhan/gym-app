services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gymdb
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d gymdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  activemq:
    image: apache/activemq-classic:5.18.3
    ports:
      - "61616:61616"   # JMS / OpenWire
      - "8161:8161"     # Web console (admin/admin by default)
    environment:
      ACTIVEMQ_CONNECTION_USER: activemq
      ACTIVEMQ_CONNECTION_PASSWORD: activemq
    volumes:
      - ./activemq/activemq.xml:/opt/apache-activemq/conf/activemq.xml
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/61616' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "9000:9000"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Must match issuer-uri in trainer-report-service so JWT 'iss' claim validates correctly
      APP_AUTH_ISSUER_URI: http://auth-service:9000
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  gym-core:
    build:
      context: .
      dockerfile: gym-core/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gymdb
      SPRING_DATASOURCE_USERNAME: docker
      SPRING_DATASOURCE_PASSWORD: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ACTIVEMQ_USER: activemq
      SPRING_ACTIVEMQ_PASSWORD: activemq
      # Must be a Base64-encoded string of at least 32 bytes for HMAC-SHA256 signing
      APP_JWT_SECRET: ${APP_JWT_SECRET:-ZGV2LXNlY3JldC1rZXktYXQtbGVhc3QtMzItY2hhcnM=}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      activemq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  trainer-report-service:
    build:
      context: .
      dockerfile: trainer-report-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_ACTIVEMQ_BROKER_URL: tcp://activemq:61616
      SPRING_ACTIVEMQ_USER: activemq
      SPRING_ACTIVEMQ_PASSWORD: activemq
      # Must match APP_AUTH_ISSUER_URI set in auth-service so JWT 'iss' claim validates correctly
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth-service:9000
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      activemq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
