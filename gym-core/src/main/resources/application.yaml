spring:
  application:
    name: gym-core
  flyway:
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  activemq:
    broker-url: tcp://localhost:61616
    user: activemq
    password: activemq

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: "${APP_JWT_SECRET:ZGV2LXNlY3JldC1rZXktYXQtbGVhc3QtMzItY2hhcnM=}"
    expiration-ms: 86400000  # 24 hours
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:8080}"
    allowed-methods: "${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}"
    allowed-headers: "${CORS_ALLOWED_HEADERS:*}"
    allow-credentials: true
    max-age: 3600
  messaging:
    training-events-queue: training.events
