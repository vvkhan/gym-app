spring:
  activemq:
    broker-url: vm://localhost?broker.persistent=false
    user: ""
    password: ""
  flyway:
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

app:
  cors:
    allowed-origins:
      - http://localhost:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: false
    max-age: 3600
  messaging:
    training-events-queue: training.events
  jwt:
    # 32-byte base64-encoded key for component tests — do NOT use in production
    secret: dGVzdGluZ1NlY3JldEtleUZvckN1Y3VtYmVyVGVzdHM=
    expiration-ms: 3600000
